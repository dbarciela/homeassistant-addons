name: Build Add-on

on:
  release:
    types: [published]
  push:
    branches:
      - main
    paths:
      - "addons/antigravity-cli/**"
      - ".github/workflows/build.yaml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to GitHub Container Registry"
        type: boolean
        default: true

jobs:
  build:
    name: Build & Publish Add-on (${{ matrix.arch }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        arch: ["aarch64", "amd64"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Publish Add-on
        uses: home-assistant/builder@master
        with:
          args: |
            --target ./addons/antigravity-cli \
            --image "ghcr.io/${{ github.repository_owner }}/{arch}-addon-antigravity-cli" \
            --docker-hub ghcr.io/${{ github.repository_owner }} \
            --docker-user ${{ github.actor }} \
            --docker-password ${{ secrets.GITHUB_TOKEN }} \
            --addon \
            --${{ matrix.arch }}
